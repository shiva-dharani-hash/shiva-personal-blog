<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Shiva.">
  <title>Contact | Shiva's Digital Journal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">Shiva<span>.</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main class="page">
    <section class="page-header">
      <p class="eyebrow">LET'S CONNECT</p>
      <h1>Have an idea?<br><span>Let's talk.</span></h1>
    </section>

    <section class="contact-layout">
      <div>
        <h2>Get in touch</h2>
        <p>
          Whether you want to discuss a project, technology, UI/UX or simply
          say hello, feel free to reach out.
        </p>

        <div class="contact-links">
          <a href="mailto:your-email@example.com">Email ↗</a>
          <a href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn ↗</a>
          <a href="https://github.com/" target="_blank" rel="noopener">GitHub ↗</a>
        </div>
      </div>

      <form class="contact-form" onsubmit="return sendMessage(event)">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Your name" required>

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="your@email.com" required>

        <label for="message">Message</label>
        <textarea id="message" rows="6" placeholder="Write your message..." required></textarea>

        <button class="btn primary" type="submit">Send Message</button>
        <p id="form-message" class="form-message"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 Shiva's Digital Journal</p>
    <p>Thanks for visiting.</p>
  </footer>

  <script>
    function sendMessage(event) {
      event.preventDefault();
      const name = document.getElementById("name").value;
      document.getElementById("form-message").textContent =
        "Thanks, " + name + "! This demo form is ready to connect to a backend.";
      event.target.reset();
      return false;
    }
  </script>
</body>
</html>
